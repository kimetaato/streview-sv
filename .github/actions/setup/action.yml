name: 'Setup Gradle Environment'
description: 'Setup JDK and Gradle with caching'

runs:
  using: "composite"
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          services/api/src/.gradle/
        key: gradle-${{ hashFiles('services/api/src/**/*.gradle*', 'services/api/src/**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ hashFiles('services/api/src/**/*.gradle*') }}
          gradle-

    - name: Ensure gradlew is executable
      shell: bash
      working-directory: services/api/src
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        else
          echo "Error: gradlew not found in $(pwd)"
          exit 1
        fi