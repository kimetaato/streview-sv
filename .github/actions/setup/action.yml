name: 'Setup Gradle Environment'
description: 'Setup JDK and Gradle with caching for faster builds'

runs:
  using: "composite"
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ./services/api/src/.gradle/
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ hashFiles('**/*.gradle*') }}
          gradle-

    # シェルコマンドも実行可能
    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./services/api/src/gradlew