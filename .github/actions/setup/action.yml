name: 'Setup Gradle Environment'
description: 'Setup JDK and Gradle with caching for faster builds'

# 入力パラメータ（オプション）
inputs:
  java-version:
    description: 'Java version to setup'
    required: false
    default: '21'
  working-directory:
    description: 'Working directory for Gradle'
    required: false
    default: './services/api/src'

runs:
  using: "composite"
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ${{ inputs.working-directory }}/.gradle/
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ hashFiles('**/*.gradle*') }}
          gradle-

    # シェルコマンドも実行可能
    - name: Make gradlew executable
      shell: bash
      run: chmod +x ${{ inputs.working-directory }}/gradlew