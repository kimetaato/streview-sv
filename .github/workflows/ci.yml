name: CI
on:
  pull_request:
    branches:
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
      PGDATA: /var/lib/postgresql/data
      REV_PXY_HTTP_HOST_PORT: 80
      REV_PXY_HTTPS_HOST_PORT: 443
      API_HTTP_HOST_PORT: 8080
      API_MOCK_HTTP_HOST_PORT: 4010

    steps:
      - uses: actions/checkout@v4

      - name: Start containers
        run: |
          docker compose -f compose.yml -f compose.ci.yml up -d api-srv

      - name: Run linter
        run: |
          docker compose exec -T api-srv bash -c "cd src && ./gradlew detektAll --no-configuration-cache"

      - name: Run tests
        run: |
          docker compose exec -T api-srv bash -c "cd src && ./gradlew test"

      - name: Build project
        run: |
          docker compose exec -T api-srv bash -c "cd src && ./gradlew build"
