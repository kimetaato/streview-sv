# 店舗に関する登録・取得系エンドポイントをまとめたパス定義

/stores:
  post:
    summary: 店舗を登録する
    description: 新しい店舗情報を登録します。画像を含む場合は multipart/form-data を使用
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '../components/schemas/store/StorePostRequest.yaml'
    responses:
      '201': { description: 店舗登録成功 }
      '400': { description: 不正なリクエスト（必須項目不足など） }
      '401': { description: 認証が必要です }
      '500': { description: サーバー内部エラー }

/stores/{s_id}:
  get:
    summary: 店舗詳細取得（レビュー付き）
    description: 指定された店舗IDの情報と、その店舗に対するレビュー情報の取得。
    parameters:
      - name: s_id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 店舗とレビュー情報の取得成功
        content:
          multipart/form-data:
            schema:
              $ref: '../components/schemas/store/StoreWithReviews.yaml'
      '404': { description: 店舗が見つかりません }
      '500': { description: サーバー内部エラー }

/stores/locations:
  get:
    summary: 周辺店舗の位置情報取得
    description: 現在地や指定されたフィルタ条件に基づいて、周辺の店舗情報を取得します。
    parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
          example: "cafe"
        description: 検索条件（ジャンル名やキーワードなど）
    responses:
      '200':
        description: 取得成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/store/StoresLocationResponse.yaml'
      '400':
        description: 無効なリクエスト
      '500':
        description: サーバー内部エラー
